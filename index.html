<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempoFlow — Smart Checklist &amp; Countdown Tracker</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #1e1b4b 0%, #6d28d9 45%, #ec4899 75%, #fb923c 100%);
      --card-bg: rgba(255, 255, 255, 0.93);
      --text-main: #102a43;
      --text-muted: #486581;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #d9e2ec;
      --shadow: 0 8px 24px rgba(16, 42, 67, 0.14);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      min-height: 100vh;
      background-color: #1e1b4b;
      background-image: var(--bg-gradient);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-main);
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 20px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button, select, input, textarea {
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      background: #fff;
      color: var(--text-main);
    }
    button { cursor: pointer; font-weight: 600; transition: all 0.15s ease; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary:hover { background: #f0f4f8; }
    #reminderBanner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--text-main); }
    .status-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { padding: 6px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .status-In-Progress { background: #dbeafe; color: #1e40af; }
    .status-Waiting-on { background: #fef3c7; color: #92400e; }
    .status-Hold { background: #f3e8ff; color: #6b21a8; }
    .status-Complete { background: #dcfce7; color: #166534; }
    .status-Not-needed { background: #f1f5f9; color: #475569; }
    .nearing-list { list-style: none; font-size: 0.88rem; }
    .nearing-list li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .nearing-list li:last-child { border-bottom: none; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid transparent;
      font-weight: 600;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .add-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }
    .add-form .full-width { grid-column: 1 / -1; }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-item {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--accent);
    }
    .task-item.priority-High { border-left-color: #dc2626; }
    .task-item.priority-Medium { border-left-color: #f59e0b; }
    .task-item.priority-Low { border-left-color: #10b981; }
    .task-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .task-title-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .task-title { font-weight: 700; font-size: 1.05rem; }
    .task-item.is-done .task-title { text-decoration: line-through; opacity: 0.65; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
    }
    .countdown-box {
      font-family: monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .countdown-box.overdue { background: #fee2e2; color: #b91c1c; }
    .task-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-notes {
      background: rgba(248, 250, 252, 0.85);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .task-notes ul { margin-left: 18px; margin-top: 4px; }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    body.compact-mode .task-item { padding: 10px 14px; }
    body.compact-mode .task-details { display: none; }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal {
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bg-swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .swatch { height: 48px; border-radius: 8px; border: 2px solid #cbd5e1; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>TempoFlow &mdash; Smart Checklist &amp; Countdown Tracker</h1>
        <small style="color: var(--text-muted);">Organize Personal, Work, Home Chores &amp; Kids tasks</small>
      </div>
      <div class="toolbar">
        <button type="button" id="viewToggleBtn" class="secondary">Compact View</button>
        <button type="button" id="themeBtn" class="secondary">Backgrounds</button>
        <button type="button" id="shareBtn" class="primary">Share / Export</button>
      </div>
    </header>
    <div id="reminderBanner">
      <span id="reminderText"></span>
      <button type="button" onclick="document.getElementById('reminderBanner').style.display='none'" class="secondary">Dismiss</button>
    </div>
    <div class="summary-grid">
      <div class="card">
        <h2>Task Status Overview</h2>
        <div id="statusSummary" class="status-pills"></div>
      </div>
      <div class="card">
        <h2>Nearing Target Time (Next 48h / Overdue)</h2>
        <ul id="nearingSummary" class="nearing-list"></ul>
      </div>
    </div>

    <div class="tabs" id="categoryTabs"></div>

    <div class="card" style="margin-bottom: 20px;">
      <h2>Add New Activity</h2>
      <form id="taskForm" class="add-form">
        <input type="text" id="taskTitle" placeholder="Activity title..." required />
        <select id="taskCategory"></select>
        <select id="taskSubcategory"></select>
        <input type="datetime-local" id="taskDate" required />
        <select id="taskPriority">
          <option value="High">High Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <select id="taskStatus">
          <option value="In Progress">In Progress</option>
          <option value="Waiting on">Waiting on</option>
          <option value="Hold">Hold</option>
          <option value="Complete">Complete</option>
          <option value="Not needed">Not needed</option>
        </select>
        <select id="taskRecurring">
          <option value="none">No Repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
        <select id="taskReminder">
          <option value="0">Remind at due time</option>
          <option value="15">15 mins before</option>
          <option value="60" selected>1 hour before</option>
          <option value="1440">1 day before</option>
        </select>
        <textarea id="taskNotes" class="full-width" rows="2" placeholder="Optional notes or sub-list items (one item per line)..."></textarea>
        <button type="submit" class="primary full-width">+ Add Activity</button>
      </form>
    </div>
    <div class="filter-bar">
      <select id="filterSubcategory">
        <option value="ALL">All Subcategories</option>
      </select>
      <select id="filterStatus">
        <option value="ALL">All Statuses</option>
        <option value="In Progress">In Progress</option>
        <option value="Waiting on">Waiting on</option>
        <option value="Hold">Hold</option>
        <option value="Complete">Complete</option>
        <option value="Not needed">Not needed</option>
      </select>
      <select id="sortBy">
        <option value="dateAsc">Sort: Nearest Target Date</option>
        <option value="dateDesc">Sort: Furthest Target Date</option>
        <option value="priority">Sort: Highest Priority</option>
      </select>
    </div>
    <div id="taskList" class="task-list"></div>
  </div>
  <div id="shareModal" class="modal-backdrop">
    <div class="modal">
      <h3>Share Checklist Summary</h3>
      <textarea id="shareText" rows="10" readonly></textarea>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button type="button" id="copyShareBtn" class="primary">Copy to Clipboard</button>
        <button type="button" onclick="closeModal('shareModal')" class="secondary">Close</button>
      </div>
    </div>
  </div>
  <div id="themeModal" class="modal-backdrop">
    <div class="modal">
      <h3>Choose Background Theme</h3>
      <div class="bg-swatches">
        <div class="swatch" style="background: linear-gradient(180deg, #1e1b4b 0%, #6d28d9 45%, #ec4899 75%, #fb923c 100%);" onclick="setScene('sunset')" title="Mountain Sunset"></div>
        <div class="swatch" style="background: linear-gradient(180deg, #020617 0%, #064e3b 45%, #10b981 80%, #a7f3d0 100%);" onclick="setScene('aurora')" title="Northern Lights"></div>
        <div class="swatch" style="background: linear-gradient(180deg, #0c4a6e 0%, #0284c7 50%, #7dd3fc 80%, #fef08a 100%);" onclick="setScene('ocean')" title="Ocean Horizon"></div>
        <div class="swatch" style="background: linear-gradient(180deg, #020617 0%, #1e293b 60%, #334155 100%);" onclick="setScene('starry')" title="Starry Night"></div>
        <div class="swatch" style="background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);" onclick="setBg('linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%)')" title="Clean Slate"></div>
        <div class="swatch" style="background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);" onclick="setBg('linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%)')" title="Sky Blue"></div>
      </div>
      <label style="font-size: 0.85rem; font-weight: 600;">Custom Image URL:</label>
      <div style="display: flex; gap: 8px;">
        <input type="url" id="customImgUrl" placeholder="https://example.com" style="flex: 1;" />
        <button type="button" onclick="setBgImage()" class="primary">Apply</button>
      </div>
      <div style="display: flex; justify-content: flex-end;">
        <button type="button" onclick="closeModal('themeModal')" class="secondary">Done</button>
      </div>
    </div>
  </div>
  <script>
    var CATEGORIES = {
      "All": [],
      "Personal": ["Bill Payments", "Health", "Meet ups", "Family Gatherings", "Birthday Reminders"],
      "Work": ["Project Deadlines", "Meeting Dates", "Tasks To Do"],
      "Home Chores": ["Groceries", "To Do"],
      "Kids": ["School", "Activities", "Appointments"]
    };
    var STATUSES = ["In Progress", "Waiting on", "Hold", "Complete", "Not needed"];
    var activeCategory = "All";
    var compactMode = false;
    var notifiedIds = {};
    var tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem("checklist_tasks_v1") || "[]");
    } catch (e) {
      tasks = [];
    }

    if (!tasks || !tasks.length) {
      tasks = [
        { id: "1", title: "Pay Electricity & Internet Bills", category: "Personal", subcategory: "Bill Payments", targetDate: new Date(Date.now() + 18 * 3600000).toISOString().slice(0, 16), priority: "High", status: "In Progress", recurring: "monthly", reminderMins: 60, notes: "Check autopay confirmation | Download PDF receipt" },
        { id: "2", title: "Q4 Project Milestone Review", category: "Work", subcategory: "Project Deadlines", targetDate: new Date(Date.now() + 42 * 3600000).toISOString().slice(0, 16), priority: "High", status: "Waiting on", recurring: "none", reminderMins: 1440, notes: "Waiting on design team assets | Finalize slide deck" },
        { id: "3", title: "Weekly Grocery Run", category: "Home Chores", subcategory: "Groceries", targetDate: new Date(Date.now() + 72 * 3600000).toISOString().slice(0, 16), priority: "Medium", status: "In Progress", recurring: "weekly", reminderMins: 60, notes: "Milk & eggs | Fresh produce | Whole grain bread" }
      ];
    }

    function statusClass(s) {
      return "status-" + s.replace(/\s+/g, "-");
    }

    function saveTasks() {
      try { localStorage.setItem("checklist_tasks_v1", JSON.stringify(tasks)); } catch (e) {}
    }

    function initUI() {
      var cats = Object.keys(CATEGORIES);
      var tabsHtml = "";
      for (var i = 0; i < cats.length; i++) {
        var c = cats[i];
        tabsHtml += '<button type="button" class="tab-btn ' + (c === activeCategory ? 'active' : '') + '" onclick="selectCategory(\'' + c + '\')">' + c + '</button>';
      }
      document.getElementById("categoryTabs").innerHTML = tabsHtml;

      var catSel = document.getElementById("taskCategory");
      var optHtml = "";
      for (var j = 0; j < cats.length; j++) {
        if (cats[j] !== "All") optHtml += '<option value="' + cats[j] + '">' + cats[j] + '</option>';
      }
      catSel.innerHTML = optHtml;
      catSel.onchange = updateFormSubs;
      updateFormSubs();
      updateFilterSubs();
      document.getElementById("taskDate").value = new Date(Date.now() + 86400000).toISOString().slice(0, 16);
    }

    function updateFormSubs() {
      var subs = CATEGORIES[document.getElementById("taskCategory").value] || [];
      var html = "";
      for (var i = 0; i < subs.length; i++) html += '<option value="' + subs[i] + '">' + subs[i] + '</option>';
      document.getElementById("taskSubcategory").innerHTML = html;
    }

    function updateFilterSubs() {
      var subs = [];
      if (activeCategory === "All") {
        var keys = Object.keys(CATEGORIES);
        for (var k = 0; k < keys.length; k++) subs = subs.concat(CATEGORIES[keys[k]]);
      } else {
        subs = CATEGORIES[activeCategory] || [];
      }
      var html = '<option value="ALL">All Subcategories</option>';
      for (var i = 0; i < subs.length; i++) html += '<option value="' + subs[i] + '">' + subs[i] + '</option>';
      document.getElementById("filterSubcategory").innerHTML = html;
    }

    function selectCategory(cat) {
      activeCategory = cat;
      var btns = document.querySelectorAll(".tab-btn");
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("active", btns[i].textContent === cat);
      if (cat !== "All") {
        document.getElementById("taskCategory").value = cat;
        updateFormSubs();
      }
      updateFilterSubs();
      renderTasks();
    }

    document.getElementById("taskForm").onsubmit = function(e) {
      e.preventDefault();
      tasks.push({
        id: Date.now().toString(),
        title: document.getElementById("taskTitle").value.trim(),
        category: document.getElementById("taskCategory").value,
        subcategory: document.getElementById("taskSubcategory").value,
        targetDate: document.getElementById("taskDate").value,
        priority: document.getElementById("taskPriority").value,
        status: document.getElementById("taskStatus").value,
        recurring: document.getElementById("taskRecurring").value,
        reminderMins: parseInt(document.getElementById("taskReminder").value, 10),
        notes: document.getElementById("taskNotes").value.trim()
      });
      saveTasks();
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskNotes").value = "";
      renderAll();
    };

    function changeStatus(id, newStatus) {
      for (var i = 0; i < tasks.length; i++) {
        if (tasks[i].id === id) {
          var t = tasks[i];
          t.status = newStatus;
          if (newStatus === "Complete" && t.recurring !== "none") {
            var d = new Date(t.targetDate);
            if (t.recurring === "daily") d.setDate(d.getDate() + 1);
            if (t.recurring === "weekly") d.setDate(d.getDate() + 7);
            if (t.recurring === "monthly") d.setMonth(d.getMonth() + 1);
            if (t.recurring === "yearly") d.setFullYear(d.getFullYear() + 1);
            tasks.push({
              id: Date.now().toString(),
              title: t.title,
              category: t.category,
              subcategory: t.subcategory,
              targetDate: d.toISOString().slice(0, 16),
              priority: t.priority,
              status: "In Progress",
              recurring: t.recurring,
              reminderMins: t.reminderMins,
              notes: t.notes
            });
          }
          break;
        }
      }
      saveTasks();
      renderAll();
    }

    function deleteTask(id) {
      tasks = tasks.filter(function(x) { return x.id !== id; });
      saveTasks();
      renderAll();
    }

    function openGoogleCalendar(id) {
      var t = tasks.find(function(x) { return x.id === id; });
      if (!t) return;
      var start = new Date(t.targetDate);
      var end = new Date(start.getTime() + 3600000);
      function fmt(d) { return d.toISOString().replace(/[-:]/g, "").split(".") + "Z"; }
      var details = "Category: " + t.category + " > " + t.subcategory + " | Status: " + t.status + " | Priority: " + t.priority + " | Notes: " + (t.notes || "None");
      window.open("https://google.com" + encodeURIComponent(t.title) + "&dates=" + fmt(start) + "/" + fmt(end) + "&details=" + encodeURIComponent(details), "_blank");
    }

    function getCountdown(dateStr, status) {
      if (status === "Complete" || status === "Not needed") return { text: status, overdue: false };
      var diff = new Date(dateStr).getTime() - Date.now();
      if (diff <= 0) return { text: "Overdue!", overdue: true };
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff / 3600000) % 24);
      var m = Math.floor((diff / 60000) % 60);
      var s = Math.floor((diff / 1000) % 60);
      return { text: d + "d " + h + "h " + m + "m " + s + "s", overdue: false };
    }

    function renderSummary() {
      var counts = {};
      for (var i = 0; i < STATUSES.length; i++) counts[STATUSES[i]] = 0;
      for (var j = 0; j < tasks.length; j++) counts[tasks[j].status] = (counts[tasks[j].status] || 0) + 1;

      var pillsHtml = "";
      for (var k = 0; k < STATUSES.length; k++) {
        var st = STATUSES[k];
        pillsHtml += '<span class="pill ' + statusClass(st) + '">' + st + ': ' + counts[st] + '</span>';
      }
      document.getElementById("statusSummary").innerHTML = pillsHtml;

      var near = tasks.filter(function(t) {
        return t.status !== "Complete" && t.status !== "Not needed" && (new Date(t.targetDate).getTime() - Date.now()) <= 172800000;
      }).sort(function(a, b) {
        return new Date(a.targetDate) - new Date(b.targetDate);
      });

      var nearHtml = "";
      if (near.length === 0) {
        nearHtml = '<li style="color:var(--text-muted);">No tasks due within the next 48 hours.</li>';
      } else {
        for (var n = 0; n < Math.min(near.length, 5); n++) {
          var t = near[n];
          var c = getCountdown(t.targetDate, t.status);
          nearHtml += '<li><span><strong>' + t.title + '</strong> (' + t.category + ')</span><span style="color:' + (c.overdue ? '#dc2626' : '#d97706') + ';font-weight:700;">' + c.text + '</span></li>';
        }
      }
      document.getElementById("nearingSummary").innerHTML = nearHtml;
    }

    function renderTasks() {
      var subF = document.getElementById("filterSubcategory").value;
      var stF = document.getElementById("filterStatus").value;
      var sortBy = document.getElementById("sortBy").value;
      var w = { High: 3, Medium: 2, Low: 1 };

      var list = tasks.filter(function(t) {
        return (activeCategory === "All" || t.category === activeCategory) &&
               (subF === "ALL" || t.subcategory === subF) &&
               (stF === "ALL" || t.status === stF);
      });

      list.sort(function(a, b) {
        if (sortBy === "dateAsc") return new Date(a.targetDate) - new Date(b.targetDate);
        if (sortBy === "dateDesc") return new Date(b.targetDate) - new Date(a.targetDate);
        return w[b.priority] - w[a.priority];
      });

      var el = document.getElementById("taskList");
      if (list.length === 0) {
        el.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted);">No activities match your filters.</div>';
        return;
      }

      var html = "";
for (var i = 0; i < list.length; i++) {
var t = list[i];
var cd = getCountdown(t.targetDate, t.status);
var done = t.status === "Complete" || t.status === "Not needed";
var notesHtml = "";
if (t.notes) {
var lines = t.notes.indexOf("|") !== -1 ? t.notes.split("|") : t.notes.split(String.fromCharCode(10));
var liHtml = "";
for (var l = 0; l < lines.length; l++) {
if (lines[l].trim()) liHtml += "" + lines[l].trim() + "";
}
notesHtml = 'Notes / Sub-list:' + liHtml + '';
}
var optHtml = "";
for (var s = 0; s < STATUSES.length; s++) {
var st = STATUSES[s];
optHtml += '<option value="' + st + '" ' + (st === t.status ? 'selected' : '') + '>' + st + '';
}
html += '' +
'' +
'' +
'' + t.title + '' +

setInterval(function() {

var t = tasks[i];
var el = document.querySelector('[data-cd="' + t.id + '"]');
var info = getCountdown(t.targetDate, t.status);
if (el) {
el.textContent = info.text;
el.classList.toggle("overdue", info.overdue);
}
if (t.status !== "Complete" && t.status !== "Not needed" && !notifiedIds[t.id]) {
var mins = (new Date(t.targetDate).getTime() - Date.now()) / 60000;
if (mins <= t.reminderMins && mins > -60) {
notifiedIds[t.id] = true;
document.getElementById("reminderText").textContent = 'Reminder: "' + t.title + '" is due ' + (mins <= 0 ? 'now' : 'in ' + Math.ceil(mins) + ' mins') + '!';
document.getElementById("reminderBanner").style.display = "flex";
}
}
}
