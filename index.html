<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempoFlow — Smart Checklist & Countdown Tracker</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #102a43;
      --text-muted: #486581;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #d9e2ec;
      --shadow: 0 8px 24px rgba(16, 42, 67, 0.08);
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      transition: background 0.3s ease;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 20px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button, select, input, textarea {
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      background: #fff;
      color: var(--text-main);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.secondary:hover {
      background: #f0f4f8;
    }

    #reminderBanner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-In-Progress { background: #dbeafe; color: #1e40af; }
    .status-Waiting-on { background: #fef3c7; color: #92400e; }
    .status-Hold { background: #f3e8ff; color: #6b21a8; }
    .status-Complete { background: #dcfce7; color: #166534; }
    .status-Not-needed { background: #f1f5f9; color: #475569; }

    .nearing-list {
      list-style: none;
      font-size: 0.88rem;
    }

    .nearing-list li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .nearing-list li:last-child { border-bottom: none; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid transparent;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .add-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .add-form .full-width {
      grid-column: 1 / -1;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--accent);
      transition: transform 0.15s ease;
    }

    .task-item.priority-High { border-left-color: #dc2626; }
    .task-item.priority-Medium { border-left-color: #f59e0b; }
    .task-item.priority-Low { border-left-color: #10b981; }

    .task-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .task-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .task-title {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .task-item.is-done .task-title {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
    }

    .countdown-box {
      font-family: monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .countdown-box.overdue {
      background: #fee2e2;
      color: #b91c1c;
    }

    .task-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-notes {
      background: rgba(248, 250, 252, 0.8);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .task-notes ul {
      margin-left: 18px;
      margin-top: 4px;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    body.compact-mode .task-item {
      padding: 10px 14px;
    }
    body.compact-mode .task-details {
      display: none;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bg-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .swatch {
      height: 44px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>TempoFlow — Smart Checklist & Countdown Tracker</h1>
        <small style="color: var(--text-muted);">Organize Personal, Work, Home Chores & Kids tasks</small>
      </div>
      <div class="toolbar">
        <button type="button" id="viewToggleBtn" class="secondary">Compact View</button>
        <button type="button" id="themeBtn" class="secondary">Backgrounds</button>
        <button type="button" id="shareBtn" class="primary">Share / Export</button>
      </div>
    </header>

    <div id="reminderBanner">
      <span id="reminderText"></span>
      <button type="button" onclick="document.getElementById('reminderBanner').style.display='none'" class="secondary">Dismiss</button>
    </div>

    <div class="summary-grid">
      <div class="card">
        <h2>Task Status Overview</h2>
        <div id="statusSummary" class="status-pills"></div>
      </div>
      <div class="card">
        <h2>Nearing Target Time (Next 48h / Overdue)</h2>
        <ul id="nearingSummary" class="nearing-list"></ul>
      </div>
    </div>

    <div class="tabs" id="categoryTabs"></div>

    <div class="card" style="margin-bottom: 20px;">
      <h2>Add New Activity</h2>
      <form id="taskForm" class="add-form">
        <input type="text" id="taskTitle" placeholder="Activity title..." required />
        <select id="taskCategory"></select>
        <select id="taskSubcategory"></select>
        <input type="datetime-local" id="taskDate" required />
        <select id="taskPriority">
          <option value="High">High Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <select id="taskStatus">
          <option value="In Progress">In Progress</option>
          <option value="Waiting on">Waiting on</option>
          <option value="Hold">Hold</option>
          <option value="Complete">Complete</option>
          <option value="Not needed">Not needed</option>
        </select>
        <select id="taskRecurring">
          <option value="none">No Repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
                <select id="taskReminder">
          <option value="0">Remind at due time</option>
          <option value="15">15 mins before</option>
          <option value="60" selected>1 hour before</option>
          <option value="1440">1 day before</option>
        </select>
        <textarea id="taskNotes" class="full-width" rows="2" placeholder="Optional notes or sub-list items (one item per line)..."></textarea>
        <button type="submit" class="primary full-width">+ Add Activity</button>
      </form>
    </div>

    <div class="filter-bar">
      <select id="filterSubcategory">
        <option value="ALL">All Subcategories</option>
      </select>
      <select id="filterStatus">
        <option value="ALL">All Statuses</option>
        <option value="In Progress">In Progress</option>
        <option value="Waiting on">Waiting on</option>
        <option value="Hold">Hold</option>
        <option value="Complete">Complete</option>
        <option value="Not needed">Not needed</option>
      </select>
      <select id="sortBy">
        <option value="dateAsc">Sort: Nearest Target Date</option>
        <option value="dateDesc">Sort: Furthest Target Date</option>
        <option value="priority">Sort: Highest Priority</option>
      </select>
    </div>

    <div id="taskList" class="task-list"></div>
  </div>

  </div>

  <div id="shareModal" class="modal-backdrop">
    <div class="modal">
      <h3>Share Checklist Summary</h3>
      <textarea id="shareText" rows="10" readonly></textarea>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button type="button" id="copyShareBtn" class="primary">Copy to Clipboard</button>
        <button type="button" onclick="closeModal('shareModal')" class="secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="themeModal" class="modal-backdrop">
    <div class="modal">
      <h3>Choose Background Theme</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Scenic Landscapes</p>
      <div class="bg-swatches">
        <div class="swatch" style="background: linear-gradient(180deg, #1e1b4b 0%, #6d28d9 45%, #ec4899 75%, #fb923c 100%);" onclick="setScene('sunset')" title="Mountain Sunset"></div>
        <div class="swatch" style="background: linear-gradient(180deg, #020617 0%, #064e3b 45%, #10b981 80%, #a7f3d0 100%);" onclick="setScene('aurora')" title="Northern Lights"></div>
        <div class="swatch" style="background: linear-gradient(180deg, #0c4a6e 0%, #0284c7 50%, #7dd3fc 80%, #fef08a 100%);" onclick="setScene('ocean')" title="Ocean Horizon"></div>
        <div class="swatch" style="background: linear-gradient(180deg, #020617 0%, #1e293b 60%, #334155 100%);" onclick="setScene('starry')" title="Starry Night"></div>
        <div class="swatch" style="background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);" onclick="setBg('linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%)')" title="Default Slate"></div>
        <div class="swatch" style="background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);" onclick="setBg('linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%)')" title="Sky Blue"></div>
      </div>

      <label style="font-size: 0.85rem; font-weight: 600;">Custom Image URL:</label>
      <div style="display: flex; gap: 8px;">
        <input type="url" id="customImgUrl" placeholder="https://example.com" style="flex: 1;" />
        <button type="button" onclick="setBgImage()" class="primary">Apply</button>
      </div>
      <div style="display: flex; justify-content: flex-end;">
        <button type="button" onclick="closeModal('themeModal')" class="secondary">Done</button>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      "All": [],
      "Personal": ["Bill Payments", "Health", "Meet ups", "Family Gatherings", "Birthday Reminders"],
      "Work": ["Project Deadlines", "Meeting Dates", "Tasks To Do"],
      "Home Chores": ["Groceries", "To Do"],
      "Kids": ["School", "Activities", "Appointments"]
    };

    const STATUSES = ["In Progress", "Waiting on", "Hold", "Complete", "Not needed"];

    let activeCategory = "All";
    let compactMode = false;
    let notifiedIds = new Set();

    let tasks = [];
    try {
      const saved = localStorage.getItem("checklist_tasks_v1");
      if (saved) tasks = JSON.parse(saved);
    } catch (e) {
      tasks = [];
    }

    if (!Array.isArray(tasks) || tasks.length === 0) {
      tasks = [
        {
          id: "1",
          title: "Pay Electricity & Internet Bills",
          category: "Personal",
          subcategory: "Bill Payments",
          targetDate: new Date(Date.now() + 18 * 3600 * 1000).toISOString().slice(0, 16),
          priority: "High",
          status: "In Progress",
          recurring: "monthly",
          reminderMins: 60,
          notes: "Check autopay confirmation\nDownload PDF receipt"
        },
        {
          id: "2",
          title: "Q4 Project Milestone Review",
          category: "Work",
          subcategory: "Project Deadlines",
          targetDate: new Date(Date.now() + 42 * 3600 * 1000).toISOString().slice(0, 16),
          priority: "High",
          status: "Waiting on",
          recurring: "none",
          reminderMins: 1440,
          notes: "Waiting on design team assets\nFinalize slide deck"
        },
        {
          id: "3",
          title: "Weekly Grocery Run",
          category: "Home Chores",
          subcategory: "Groceries",
          targetDate: new Date(Date.now() + 72 * 3600 * 1000).toISOString().slice(0, 16),
          priority: "Medium",
          status: "In Progress",
          recurring: "weekly",
          reminderMins: 60,
          notes: "Milk & eggs\nFresh produce\nWhole grain bread"
        }
      ];
    }

    function statusClass(status) {
      return "status-" + status.replace(/\s+/g, "-");
    }

    function saveTasks() {
      try {
        localStorage.setItem("checklist_tasks_v1", JSON.stringify(tasks));
      } catch (e) {}
    }

    function initUI() {
      const tabsEl = document.getElementById("categoryTabs");
      tabsEl.innerHTML = Object.keys(CATEGORIES).map(function(cat) {
        return '<button type="button" class="tab-btn ' + (cat === activeCategory ? 'active' : '') + '" onclick="selectCategory(\'' + cat + '\')">' + cat + '</button>';
      }).join("");

      const catSelect = document.getElementById("taskCategory");
      catSelect.innerHTML = Object.keys(CATEGORIES)
        .filter(function(c) { return c !== "All"; })
        .map(function(cat) { return '<option value="' + cat + '">' + cat + '</option>'; })
        .join("");

      catSelect.addEventListener("change", updateFormSubcategories);
      updateFormSubcategories();
      updateFilterSubcategories();

      const tomorrow = new Date(Date.now() + 24 * 3600 * 1000);
      document.getElementById("taskDate").value = tomorrow.toISOString().slice(0, 16);
    }

    function updateFormSubcategories() {
      const cat = document.getElementById("taskCategory").value;
      const subSelect = document.getElementById("taskSubcategory");
      const subs = CATEGORIES[cat] || [];
      subSelect.innerHTML = subs.map(function(sub) {
        return '<option value="' + sub + '">' + sub + '</option>';
      }).join("");
    }

    function updateFilterSubcategories() {
      const filterSub = document.getElementById("filterSubcategory");
      let subs = [];
      if (activeCategory === "All") {
        Object.values(CATEGORIES).forEach(function(arr) {
          subs = subs.concat(arr);
        });
      } else {
        subs = CATEGORIES[activeCategory] || [];
      }
      filterSub.innerHTML = '<option value="ALL">All Subcategories</option>' +
        subs.map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join("");
    }

    function selectCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".tab-btn").forEach(function(btn) {
        btn.classList.toggle("active", btn.textContent === cat);
      });
      if (cat !== "All") {
        document.getElementById("taskCategory").value = cat;
        updateFormSubcategories();
      }
      updateFilterSubcategories();
      renderTasks();
    }

    document.getElementById("taskForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const titleVal = document.getElementById("taskTitle").value.trim();
      if (!titleVal) return;

      const newTask = {
        id: Date.now().toString(),
        title: titleVal,
        category: document.getElementById("taskCategory").value,
        subcategory: document.getElementById("taskSubcategory").value,
        targetDate: document.getElementById("taskDate").value,
        priority: document.getElementById("taskPriority").value,
        status: document.getElementById("taskStatus").value,
        recurring: document.getElementById("taskRecurring").value,
        reminderMins: parseInt(document.getElementById("taskReminder").value, 10),
        notes: document.getElementById("taskNotes").value.trim()
      };
      tasks.push(newTask);
      saveTasks();
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskNotes").value = "";
      renderAll();
    });

    function changeStatus(id, newStatus) {
      const task = tasks.find(function(t) { return t.id === id; });
      if (!task) return;
      task.status = newStatus;

      if (newStatus === "Complete" && task.recurring !== "none") {
        const nextDate = new Date(task.targetDate);
        if (task.recurring === "daily") nextDate.setDate(nextDate.getDate() + 1);
        if (task.recurring === "weekly") nextDate.setDate(nextDate.getDate() + 7);
        if (task.recurring === "monthly") nextDate.setMonth(nextDate.getMonth() + 1);
        if (task.recurring === "yearly") nextDate.setFullYear(nextDate.getFullYear() + 1);

        tasks.push({
          id: Date.now().toString(),
          title: task.title,
          category: task.category,
          subcategory: task.subcategory,
          targetDate: nextDate.toISOString().slice(0, 16),
          priority: task.priority,
          status: "In Progress",
          recurring: task.recurring,
          reminderMins: task.reminderMins,
          notes: task.notes
        });
      }
      saveTasks();
      renderAll();
    }

    function deleteTask(id) {
      tasks = tasks.filter(function(t) { return t.id !== id; });
      saveTasks();
      renderAll();
    }

    function openGoogleCalendar(id) {
      const t = tasks.find(function(item) { return item.id === id; });
      if (!t) return;
      const start = new Date(t.targetDate);
      const end = new Date(start.getTime() + 60 * 60 * 1000);
      const fmt = function(d) {
        return d.toISOString().replace(/[-:]/g, "").split(".") + "Z";
      };
      const details = "Category: " + t.category + " > " + t.subcategory + "\nStatus: " + t.status + "\nPriority: " + t.priority + "\n\nNotes:\n" + (t.notes || "None");
      const url = "https://google.com" + encodeURIComponent(t.title) + "&dates=" + fmt(start) + "/" + fmt(end) + "&details=" + encodeURIComponent(details);
      window.open(url, "_blank");
    }

    function getCountdownInfo(targetDateStr, status) {
const diff = new Date(targetDateStr).getTime() - Date.now();
if (status === "Complete" || status === "Not needed") {
return { text: status, overdue: false, nearing: false };
}
if (diff <= 0) {
return { text: "Overdue!", overdue: true, nearing: true };
}
const days = Math.floor(diff / (1000 * 60 * 60 * 24));
const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
const mins = Math.floor((diff / 1000 / 60) % 60);
const secs = Math.floor((diff / 1000) % 60);
return {
text: days + "d " + hours + "h " + mins + "m " + secs + "s",
overdue: false,
nearing: diff <= 48 * 3600 * 1000
};
}
function renderSummary() {
const statusCounts = {};
STATUSES.forEach(function(s) { statusCounts[s] = 0; });
tasks.forEach(function(t) {
statusCounts[t.status] = (statusCounts[t.status] || 0) + 1;
});
document.getElementById("statusSummary").innerHTML = STATUSES.map(function(s) {
return '' + s + ': ' + statusCounts[s] + '';
}).join("");
const nearingTasks = tasks
.filter(function(t) { return t.status !== "Complete" && t.status !== "Not needed"; })
.filter(function(t) { return (new Date(t.targetDate).getTime() - Date.now()) <= 48 * 3600 * 1000; })
.sort(function(a, b) { return new Date(a.targetDate) - new Date(b.targetDate); });
const nearingEl = document.getElementById("nearingSummary");
if (nearingTasks.length === 0) {
nearingEl.innerHTML = 'No tasks due within the next 48 hours.';
} else {
nearingEl.innerHTML = nearingTasks.slice(0, 5).map(function(t) {
const info = getCountdownInfo(t.targetDate, t.status);
return '' + t.title + ' (' + t.category + ')' + info.text + '';
}).join("");
}
}
function renderTasks() {
const subFilter = document.getElementById("filterSubcategory").value;
const statusFilter = document.getElementById("filterStatus").value;
const sortBy = document.getElementById("sortBy").value;
const priorityWeight = { High: 3, Medium: 2, Low: 1 };
let filtered = tasks.filter(function(t) {
if (activeCategory !== "All" && t.category !== activeCategory) return false;
if (subFilter !== "ALL" && t.subcategory !== subFilter) return false;
if (statusFilter !== "ALL" && t.status !== statusFilter) return false;
return true;
});
filtered.sort(function(a, b) {
if (sortBy === "dateAsc") return new Date(a.targetDate) - new Date(b.targetDate);
if (sortBy === "dateDesc") return new Date(b.targetDate) - new Date(a.targetDate);
if (sortBy === "priority") return priorityWeight[b.priority] - priorityWeight[a.priority];
return 0;
});
const listEl = document.getElementById("taskList");
if (filtered.length === 0) {
listEl.innerHTML = 'No activities match your current filters.';
return;
}

function applyWallpaper(cssImage) {
document.body.style.backgroundImage = cssImage;
document.body.style.backgroundSize = "cover";
document.body.style.backgroundPosition = "center";
document.body.style.backgroundAttachment = "fixed";
document.body.style.backgroundRepeat = "no-repeat";
try {
localStorage.setItem("tempoflow_bg_v4", cssImage);
} catch (e) {}
}

applyWallpaper(val);
}

}
