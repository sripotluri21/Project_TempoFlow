<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life & Work Checklist & Countdown Tracker</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #102a43;
      --text-muted: #486581;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #d9e2ec;
      --shadow: 0 8px 24px rgba(16, 42, 67, 0.08);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px;
      transition: background 0.3s ease;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 20px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button, select, input, textarea {
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 8px 12px;
      background: #fff;
      color: var(--text-main);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.secondary:hover {
      background: #f0f4f8;
    }

    /* Reminder Banner */
    #reminderBanner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    /* Summary Dashboard */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-In\ Progress { background: #dbeafe; color: #1e40af; }
    .status-Waiting\ on { background: #fef3c7; color: #92400e; }
    .status-Hold { background: #f3e8ff; color: #6b21a8; }
    .status-Complete { background: #dcfce7; color: #166534; }
    .status-Not\ needed { background: #f1f5f9; color: #475569; }

    .nearing-list {
      list-style: none;
      font-size: 0.88rem;
    }

    .nearing-list li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .nearing-list li:last-child { border-bottom: none; }

    /* Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid transparent;
      font-weight: 600;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Add Form */
    .add-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .add-form .full-width {
      grid-column: 1 / -1;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    /* Task List */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--accent);
      transition: transform 0.15s ease;
    }

    .task-item.priority-High { border-left-color: #dc2626; }
    .task-item.priority-Medium { border-left-color: #f59e0b; }
    .task-item.priority-Low { border-left-color: #10b981; }

    .task-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .task-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .task-title {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .task-item.is-done .task-title {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
      font-weight: 600;
    }

    .countdown-box {
      font-family: monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .countdown-box.overdue {
      background: #fee2e2;
      color: #b91c1c;
    }

    .task-details {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-notes {
      background: rgba(248, 250, 252, 0.8);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .task-notes ul {
      margin-left: 18px;
      margin-top: 4px;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    /* Compact View */
    body.compact-mode .task-item {
      padding: 10px 14px;
    }
    body.compact-mode .task-details {
      display: none;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bg-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .swatch {
      height: 44px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Checklist & Countdown Tracker</h1>
        <small style="color: var(--text-muted);">Organize Personal, Work, Home Chores & Kids tasks</small>
      </div>
      <div class="toolbar">
        <button id="viewToggleBtn" class="secondary">Compact View</button>
        <button id="themeBtn" class="secondary">Backgrounds</button>
        <button id="shareBtn" class="primary">Share / Export</button>
      </div>
    </header>

    <div id="reminderBanner">
      <span id="reminderText"></span>
      <button onclick="document.getElementById('reminderBanner').style.display='none'" class="secondary">Dismiss</button>
    </div>

    <!-- Summary Section -->
    <div class="summary-grid">
      <div class="card">
        <h2>Task Status Overview</h2>
        <div id="statusSummary" class="status-pills"></div>
      </div>
      <div class="card">
        <h2>Nearing Target Time (Next 48h / Overdue)</h2>
        <ul id="nearingSummary" class="nearing-list"></ul>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="tabs" id="categoryTabs"></div>

    <!-- Add Activity Form -->
    <div class="card" style="margin-bottom: 20px;">
      <h2>Add New Activity</h2>
      <form id="taskForm" class="add-form">
        <input type="text" id="taskTitle" placeholder="Activity title..." required />
        <select id="taskCategory"></select>
        <select id="taskSubcategory"></select>
        <input type="datetime-local" id="taskDate" required />
        <select id="taskPriority">
          <option value="High">High Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <select id="taskStatus">
          <option value="In Progress">In Progress</option>
          <option value="Waiting on">Waiting on</option>
          <option value="Hold">Hold</option>
          <option value="Complete">Complete</option>
          <option value="Not needed">Not needed</option>
        </select>
        <select id="taskRecurring">
          <option value="none">No Repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
